name: CI

# Runs on every push and pull request. This workflow needs no secrets: every
# test is mocked or offline, and no model or GitHub call is made. It requests
# read-only access to the repository contents, nothing more.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run python -m ruff check .

      - name: Check formatting
        run: uv run python -m ruff format --check .

      - name: Run the test suite
        run: uv run python -m pytest -q
