# ForgeFlow Phase 1 configuration.
# Edit this file to change the repository allowlist, ranking weights, or skills.
# No secrets belong in this file.

# Repositories ForgeFlow may discover issues from. Nothing outside this list is
# ever queried, and Phase 1 never writes to any repository.
repositories:
  - scikit-learn/scikit-learn
  - pydantic/pydantic
  - pandas-dev/pandas
  - huggingface/transformers
  - psf/requests
  - encode/httpx

# Ranking weights. These must sum to 1.0; startup validation enforces that.
# SPEC section 5: treat these as initial heuristics, not proven predictors of
# PR acceptance.
weights:
  skill_relevance: 0.25
  issue_clarity: 0.20
  feasible_scope: 0.20
  testability: 0.15
  repository_health: 0.10
  duplicate_conflict_risk: 0.10

# Keywords used to judge skill relevance (SPEC section 5). Matched
# case-insensitively against issue titles, bodies, and labels.
skill_keywords:
  python:
    - python
    - py313
    - typing
    - mypy
    - ruff
  ai_ml:
    - machine learning
    - deep learning
    - neural
    - transformer
    - model
    - inference
    - training
    - pytorch
    - tensorflow
    - scikit-learn
  data_science:
    - dataframe
    - numpy
    - pandas
    - statistics
    - visualization
  devtools:
    - cli
    - lint
    - formatter
    - packaging
    - ci
    - pytest

# Labels that make an issue ineligible in Phase 1 (SPEC section 2B).
exclude_labels:
  - duplicate
  - invalid
  - wontfix
  - "status: wontfix"
  - discussion
  - epic

# Labels meaning the repository has opted out of automated contributions.
# These are checked before exclude_labels and are reported as 'opt_out'
# (SPEC section 2B: "repositories whose contribution rules opt out").
opt_out_labels:
  - no-bot
  - do-not-contribute
  - no-automation
  - bot-not-welcome

# Labels that suggest an issue is a good starting point. Used as a positive
# signal in scope and clarity scoring.
preferred_labels:
  - good first issue
  - help wanted
  - bug

# Phase 2 model configuration. No secrets belong in this file; the API key is
# read from GEMINI_API_KEY in the environment.
#
# Model names must be ones the API key can actually reach. The previous names
# (gemini-2.5-flash, gemini-2.5-pro) are still listed in the models endpoint
# but Google now limits the 2.5 family to accounts that already used them, so a
# fresh key gets HTTP 404. Verified working against the live generateContent
# endpoint on 2026-10-24.
#
# Pricing is from the official pricing page, quoted here so a stale number is
# easy to spot:
#   source: https://ai.google.dev/gemini-api/docs/pricing
#   retrieved: 2026-10-24
#   gemini-3.5-flash-lite: input $0.30, output $2.50 per 1M tokens
#   gemini-3.6-flash:      input $0.75, output $3.75 per 1M tokens
#                          (both double on 2027-01-01; re-check before then)
llm:
  triage_model: gemini-3.5-flash-lite
  analysis_model: gemini-3.6-flash
  monthly_cap_usd: 5.0
  max_retries: 2
  timeout_seconds: 60.0
  max_output_tokens: 4096
  pricing:
    gemini-3.5-flash-lite:
      input_per_million: 0.30
      output_per_million: 2.50
    gemini-3.6-flash:
      input_per_million: 0.75
      output_per_million: 3.75

# Emergency stop (SPEC section 9). Set to true to halt all model calls and
# sandbox execution. FORGEFLOW_KILL_SWITCH=1 in the environment does the same
# thing, so the system can be stopped without editing this file.
kill_switch: false

# Outcome-driven ranking adjustment (SPEC section 11). This lets tracked PR
# results nudge future rankings. It is OFF by default and deliberately small:
# the adjustment can move an issue by at most max_adjustment_points on the
# 0-100 scale, far less than any single factor's weight.
#
# It rewards maintainer engagement, not contribution count. Merges weigh most,
# but an approval and even a changes-requested count, because a maintainer who
# engaged with the work is a real signal. A PR closed with no engagement lowers
# the score slightly. Leave enabled: false until you have real tracked outcomes
# and have checked that the nudge behaves the way you want.
outcome_ranking:
  enabled: false
  max_adjustment_points: 3.0
  points_per_merge: 1.5
  points_per_approval: 1.0
  points_per_changes_requested: 0.5
  points_per_closed_unmerged: -0.5
  lookback: 20

# Optional scheduled DISCOVERY (SPEC section 13, Phase 4). OFF by default.
#
# This schedules discovery only. Publishing is never scheduled: every external
# write needs explicit human approval (SPEC section 8), and a timer cannot give
# one. There is no background daemon; a cycle runs only when a caller invokes
# `forgeflow schedule --run` and the interval has elapsed.
#
# Turn this on only after manual discovery, ranking, analysis, validation, and
# publishing have all proved reliable by hand. See the README.
schedule:
  enabled: false
  interval_minutes: 360
