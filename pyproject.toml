[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
version = "0.1.0"
description = "AI-powered open-source contribution automation platform (Phase 1: issue discovery, ranking, reports)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyGithub>=2.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
forgeflow = "forgeflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
